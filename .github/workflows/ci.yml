name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e

  deploy-production:
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check Vercel Token & Deploy to Production
        run: |
          if [ -n "${VERCEL_TOKEN:-}" ] && npx --yes vercel whoami --token="$VERCEL_TOKEN" >/dev/null 2>&1; then
            npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            npx vercel build --prod --token="$VERCEL_TOKEN"
            npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          else
            echo "::warning::VERCEL_TOKEN trên GitHub chưa cài hoặc đã hết hạn; bỏ qua bước deploy CI (có thể deploy trực tiếp bằng 'deploy-pdf --public')." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy-preview:
    needs: [check, e2e]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check Vercel Token & Deploy Preview
        id: preview
        run: |
          if [ -n "${VERCEL_TOKEN:-}" ] && npx --yes vercel whoami --token="$VERCEL_TOKEN" >/dev/null 2>&1; then
            npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
            npx vercel build --token="$VERCEL_TOKEN"
            echo "url=$(npx vercel deploy --prebuilt --token="$VERCEL_TOKEN" | tail -1)" >> "$GITHUB_OUTPUT"
          fi
      - name: Comment preview URL
        if: steps.preview.outputs.url != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🔍 Preview: ${process.env.PREVIEW_URL}`,
            })
