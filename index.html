<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cắt, gộp PDF và chuyển Word sang PDF ngay trên trình duyệt."
    />
    <meta name="theme-color" content="#fbfbfc" />
    <meta property="og:title" content="Cắt & Gộp PDF · Word sang PDF" />
    <meta
      property="og:description"
      content="Cắt, gộp PDF và chuyển Word sang PDF ngay trên trình duyệt."
    />
    <meta property="og:type" content="website" />
    <title>Cắt & Gộp PDF · Word sang PDF</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ts-theme')
          var dark =
            saved === 'dark' ||
            ((!saved || saved === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (error) {
          /* localStorage có thể bị chặn — mặc định light */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
